[build-system]
# maturin >= 1.14 knows the free-threaded stable ABI (abi3t, PEP 803) that
# Cargo.toml opts into for CPython 3.15+; 1.15 fixes its abi3t module-export
# check. Older releases don't know the ABI and tag a 3.15 build wrongly.
# Keep in sync with the maturin install in .github/workflows/wheels.yml.
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "qpipe-rs"
# The version comes from bindings/python/Cargo.toml (single source of truth),
# which the release workflow stamps with the git tag. Do NOT add a static
# `version = "..."` here: maturin prefers it over Cargo.toml, so a stale value
# ships silently (v1.7.0 was built as 1.6.0 that way and PyPI skipped it).
dynamic = ["version"]
description = "Python bindings for qpipe (MPMC work queue)"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"   # pure-Python package lives here
module-name = "qpipe._qpipe" # native module nested under the package

[project.optional-dependencies]
msgpack = ["msgpack>=1.0"]

[tool.pytest.ini_options]
markers = ["e2e: spawns the orchestrator binary; needs the built extension"]
[dependency-groups]              # or [project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "msgpack>=1.0"]
